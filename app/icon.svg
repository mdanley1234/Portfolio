<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 88 88">
  <!-- Exhaust glow (outer, purple) -->
  <ellipse cx="30" cy="68" rx="20" ry="10" fill="#9933FF" opacity="0.8" transform="rotate(-45 30 68)"/>
  <!-- Exhaust core (orange) -->
  <ellipse cx="34" cy="64" rx="14" ry="7" fill="#FF6600" transform="rotate(-45 34 64)"/>
  <!-- Exhaust tip (bright yellow-white) -->
  <ellipse cx="37" cy="61" rx="8" ry="4" fill="#FFD700" transform="rotate(-45 37 61)"/>

  <!-- Left delta wing (behind fuselage) -->
  <polygon points="50,50 70,70 40,75" fill="#3A3A3A"/>
  <!-- Right delta wing (behind fuselage) -->
  <polygon points="50,50 28,30 22,58" fill="#3A3A3A"/>

  <!-- Main fuselage (elongated pill, angled ~45deg) -->
  <rect x="36" y="20" width="24" height="60" rx="12" fill="#4A4A4A" transform="rotate(-45 48 50)"/>
</svg>
