<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A favicon is read at 16px, so this is drawn as one shape and one colour:
       the site's accent purple, the same hue the hero's aura and the Mach
       diamond plume resolve to, with the initial cut out in white. No gradient,
       no detail below ~4px — the mark survives being a 16px square in a tab
       strip, and the flat purple is what makes it findable there against the
       black-and-white favicons either side of it. -->
  <rect width="64" height="64" rx="14" fill="#6111DD"/>
  <path d="M16 45V19l16 16 16-16v26"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
